server:
  port: 8080

spring:
  application:
    name: farmerconnect-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/farmerconnect_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:CHANGE_ME_POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

app:
  jwt:
    secret: ${JWT_SECRET:CHANGE_ME_TO_A_SECURE_256_BIT_SECRET_KEY}
    expiration-ms: 86400000 # 24 Hours

  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: gemini-3.5-flash

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
